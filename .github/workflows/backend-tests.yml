name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install pytest pydantic sqlalchemy fastapi numpy scipy
      - name: Run tests (unit + golden regression)
        run: python -m pytest -v
      - name: Smoke-run the benchmark
        run: python -m benchmarks.run --sizes small --seeds 1
